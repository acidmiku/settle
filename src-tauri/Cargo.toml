[package]
name = "settle"
version = "0.2.1"
description = "Settle — a local, editor-first notebook"
authors = ["you"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.90"

# Tauri v2 expects a build script.
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
uuid = { version = "1.7", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
regex = "1.10"

# SQLite (bundled for zero-config)
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"

# Global hotkey + clipboard (Rust-side usage)
tauri-plugin-global-shortcut = "2.3.1"
tauri-plugin-clipboard-manager = "2.3.2"
open = "5.4.4"
tauri-plugin-updater = { version = "2.14.0", default-features = false, features = ["rustls-tls", "system-proxy"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-single-instance = "2.5.4"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1

