[package]
name = "settle"
version = "0.1.0"
description = "Settle — keyboard-first smart notebook"
authors = ["you"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77"

# Tauri v2 expects a build script.
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
uuid = { version = "1.7", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
regex = "1.10"

# SQLite (bundled for zero-config)
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"

# HTTP for OpenAI-compatible LLM APIs
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["time"] }

# Global hotkey + clipboard (Rust-side usage)
tauri-plugin-global-shortcut = "2.3.1"
tauri-plugin-clipboard-manager = "2.3.2"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1

