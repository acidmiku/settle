name: build-installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-nsis:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          profile: minimal

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y

      - name: Clear proxy/offline env (defensive)
        shell: pwsh
        run: |
          "HTTP_PROXY", "HTTPS_PROXY", "ALL_PROXY" | ForEach-Object { Remove-Item "Env:\$_" -ErrorAction SilentlyContinue }
          $env:CARGO_NET_OFFLINE = "false"

      - name: Install Tauri CLI
        shell: pwsh
        run: cargo install tauri-cli --locked

      - name: Build NSIS installer
        shell: pwsh
        working-directory: src-tauri
        run: cargo tauri build --ci -b nsis

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  macos-dmg-apple-silicon:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          profile: minimal

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target

      - name: Clear proxy/offline env (defensive)
        shell: bash
        run: |
          unset HTTP_PROXY HTTPS_PROXY ALL_PROXY
          export CARGO_NET_OFFLINE=false

      - name: Install Tauri CLI
        shell: bash
        run: cargo install tauri-cli --locked

      - name: Build DMG (Apple Silicon)
        shell: bash
        working-directory: src-tauri
        run: cargo tauri build --ci -b dmg

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-apple-silicon
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - windows-nsis
      - macos-dmg-apple-silicon
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
