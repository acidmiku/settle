name: build-installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-nsis:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          profile: minimal

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y

      - name: Install Tauri CLI
        shell: pwsh
        run: cargo install tauri-cli --locked

      - name: Build NSIS installer
        shell: pwsh
        working-directory: src-tauri
        run: cargo tauri build --ci -b nsis -- --locked

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  macos-dmg-universal:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          profile: minimal
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target

      - name: Install Tauri CLI
        shell: bash
        run: cargo install tauri-cli --locked

      - name: Test macOS backend
        working-directory: src-tauri
        run: cargo test --locked

      - name: Build universal DMG (Apple Silicon + Intel)
        shell: bash
        working-directory: src-tauri
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: cargo tauri build --ci --target universal-apple-darwin -b dmg -- --locked

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-universal
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - windows-nsis
      - macos-dmg-universal
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
